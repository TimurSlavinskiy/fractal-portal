
name: Verify fractal portal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fractal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Verify mathematical PNG generation
        run: python -m unittest -v test_fractal
